[workspace]
members = ["crates/slop_sim", "crates/slop_lab", "crates/slop_game"]
resolver = "3"

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.88"

[workspace.dependencies]
libm = "0.2"

# Hundreds of slop per tick are too slow unoptimised; keep debug builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
